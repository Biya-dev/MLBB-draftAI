name: MLBBDraftAI
options:
  bundleIdPrefix: mlbb.draftai
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    APP_BUNDLE_ID: mlbb.draftai.app
    MLBB_RECEIVER_HOST: 192.168.1.158
    MLBB_SHARED_TOKEN: mlbb-phase1
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  MLBBDraftAI:
    type: application
    platform: iOS
    sources:
      - path: MLBBDraftAI
      - path: Shared
    info:
      path: MLBBDraftAI/Info.plist
      properties:
        CFBundleDisplayName: MLBB Draft AI
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: >-
          MLBB Draft AI connects to your computer on the same Wi-Fi
          network to stream your screen to the local dashboard.
        MLBB_RECEIVER_HOST: $(MLBB_RECEIVER_HOST)
        MLBB_SHARED_TOKEN: $(MLBB_SHARED_TOKEN)
    dependencies:
      - target: BroadcastExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO

  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
      - path: Shared
    info:
      path: BroadcastExtension/Info.plist
      properties:
        CFBundleDisplayName: MLBB Screen Upload
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).BroadcastSampleHandler
        MLBB_RECEIVER_HOST: $(MLBB_RECEIVER_HOST)
        MLBB_SHARED_TOKEN: $(MLBB_SHARED_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).BroadcastExtension
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        # The extension must be able to reach the local network.
        ENABLE_BITCODE: NO

  BroadcastExtensionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BroadcastExtensionTests
      # App-extension products cannot be linked into XCTest bundles. Compile
      # the exact shared protocol source in the test target instead.
      - path: Shared/WireProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).BroadcastExtensionTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  MLBBDraftAI:
    build:
      targets:
        MLBBDraftAI: all
        BroadcastExtension: all
    test:
      config: Debug
      targets:
        - BroadcastExtensionTests
    run:
      config: Debug
    archive:
      config: Release
