name: Build and Upload iOS App to TestFlight

on:
  workflow_dispatch:
    inputs:
      app_bundle_id:
        description: Registered App Store bundle ID (the extension uses the .BroadcastExtension suffix)
        required: true
        type: string
      receiver_host:
        description: Windows PC Wi-Fi IPv4 address
        required: true
        type: string

permissions:
  contents: read

jobs:
  upload-testflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release configuration
        env:
          APP_BUNDLE_ID: ${{ inputs.app_bundle_id }}
          RECEIVER_HOST: ${{ inputs.receiver_host }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          IOS_SHARED_TOKEN: ${{ secrets.IOS_SHARED_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$APP_BUNDLE_ID" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]] || {
            echo "::error::Enter a valid reverse-DNS app bundle ID."
            exit 1
          }
          [[ "$RECEIVER_HOST" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] || {
            echo "::error::Enter the Windows PC's IPv4 address."
            exit 1
          }
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || {
            echo "::error::Configure the APPLE_TEAM_ID repository secret."
            exit 1
          }
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY IOS_SHARED_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure the $name repository secret."
              exit 1
            fi
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive and export signed app
        env:
          APP_BUNDLE_ID: ${{ inputs.app_bundle_id }}
          RECEIVER_HOST: ${{ inputs.receiver_host }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          IOS_SHARED_TOKEN: ${{ secrets.IOS_SHARED_TOKEN }}
        working-directory: ios
        run: |
          set -euo pipefail
          api_key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          archive_path="$RUNNER_TEMP/MLBBDraftAI.xcarchive"
          export_path="$RUNNER_TEMP/MLBBDraftAI-export"
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          trap 'rm -f "$api_key_path" "$export_options"' EXIT
          mkdir -p "$export_path"
          umask 077
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "$api_key_path"

          xcodebuild archive \
            -project MLBBDraftAI.xcodeproj \
            -scheme MLBBDraftAI \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$api_key_path" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            APP_BUNDLE_ID="$APP_BUNDLE_ID" \
            MLBB_RECEIVER_HOST="$RECEIVER_HOST" \
            MLBB_SHARED_TOKEN="$IOS_SHARED_TOKEN" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

          cat > "$export_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$api_key_path" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

          ipa_path="$(find "$export_path" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [[ -z "$ipa_path" ]]; then
            echo "::error::Xcode export completed without producing an IPA."
            exit 1
          fi
          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Upload build with Transporter
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          api_key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          trap 'rm -f "$api_key_path"' EXIT
          umask 077
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "$api_key_path"
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP"
          xcrun iTMSTransporter \
            -m upload \
            -assetFile "$IPA_PATH" \
            -apiKey "$APP_STORE_CONNECT_KEY_ID" \
            -apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
